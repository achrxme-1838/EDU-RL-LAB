[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edu_rl_lab"
version = "0.1.0"
description = "An educational Go2 locomotion laboratory with local MDP terms and PPO"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENCE", "third_party/*LICENSE"]
dependencies = [
    "torch>=2.7,<2.8",
    "numpy>=1.26,<2",
    "tensordict==0.8.3",
    "gymnasium==1.2.0",
    "tensorboard>=2.16,<3",
    "GitPython>=3.1,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "build>=1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["edu_rl_lab*", "rsl_rl*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"scripts/rsl_rl/*.py" = ["E402"]

